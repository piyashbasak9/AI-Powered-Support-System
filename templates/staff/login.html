{% extends "base.html" %}

{% block title %}Staff Login{% endblock %}

{% block content %}
<div class="header">
    <h1>Staff Login</h1>
</div>

<div class="card">
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label>Username:</label>
            <input type="text" name="username" style="width: 100%; padding: 10px; margin-top: 5px;" required>
        </div>
        <div style="margin-bottom: 20px;">
            <label>Password:</label>
            <input type="password" name="password" style="width: 100%; padding: 10px; margin-top: 5px;" required>
        </div>
        <button type="submit">Login</button>
    </form>
</div>
{% endblock %}
